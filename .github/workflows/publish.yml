name: Kebun

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/publish.yml"
      - "kebun-safa/**"

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    name: Build and Deploy

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Build
        working-directory: kebun-safa
        run: |
          npm run build

      - name: Publish to Cloudflare Pages
        uses: cloudflare/wrangler-action@3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_API }}
          projectName: kebun-safa
          directory: kebun-safa
          wranglerVersion: '3'